<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0c6b67">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="我的课表">
  <title>2026 秋研究生课表</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <style>
    :root {
      --ink: #1c2a30;
      --muted: #66757b;
      --soft: #8b989d;
      --line: #d9e0dd;
      --line-strong: #c4cfcb;
      --paper: #ffffff;
      --canvas: #f3f6f3;
      --accent: #0c6b67;
      --accent-dark: #084f4c;
      --accent-soft: #e2f1ee;
      --today: #fff6dc;
      --shadow: 0 12px 32px rgba(24, 51, 49, 0.08);
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--canvas);
    }

    body {
      margin: 0;
      min-height: 100dvh;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(12, 107, 103, 0.06), transparent 250px),
        var(--canvas);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app {
      width: min(1500px, calc(100% - 32px));
      margin: 0 auto;
      padding:
        calc(30px + env(safe-area-inset-top))
        0
        calc(36px + env(safe-area-inset-bottom));
    }

    .page-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 22px;
    }

    .eyebrow {
      margin: 0 0 7px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 3vw, 38px);
      line-height: 1.14;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .summary {
      min-width: max-content;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(24, 51, 49, 0.04);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 14px;
    }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-button,
    .choose-button,
    .print-button,
    .install-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--paper);
      cursor: pointer;
      transition: border-color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .icon-button {
      width: 38px;
      padding: 0;
    }

    .choose-button,
    .print-button,
    .install-button {
      gap: 7px;
      padding: 0 13px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .install-button {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .install-button[hidden] {
      display: none;
    }

    .save-mode-icon,
    .save-label {
      display: none;
    }

    .icon-button:hover,
    .choose-button:hover,
    .print-button:hover,
    .install-button:hover {
      border-color: var(--accent);
      background: #f6fbfa;
    }

    .install-button:hover {
      background: var(--accent-dark);
      color: #fff;
    }

    .icon-button:active,
    .choose-button:active,
    .print-button:active,
    .install-button:active {
      transform: translateY(1px);
    }

    .icon-button:disabled {
      border-color: var(--line);
      background: #f3f6f4;
      color: #aab4b1;
      cursor: not-allowed;
    }

    .icon-button:disabled:active {
      transform: none;
    }

    .icon-button:focus-visible,
    .choose-button:focus-visible,
    .print-button:focus-visible,
    .install-button:focus-visible,
    .week-button:focus-visible {
      outline: 3px solid rgba(12, 107, 103, 0.22);
      outline-offset: 2px;
    }

    .icon-button svg,
    .choose-button svg,
    .print-button svg,
    .install-button svg {
      width: 18px;
      height: 18px;
      stroke-width: 2;
    }

    .week-label {
      min-width: 92px;
      padding: 0 6px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .date-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      height: 38px;
      padding: 0 8px 0 11px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--paper);
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      transition: border-color 150ms ease, box-shadow 150ms ease;
    }

    .date-control:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(12, 107, 103, 0.12);
    }

    .date-control svg {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      stroke-width: 2;
    }

    .date-control input {
      width: 132px;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-weight: 750;
    }

    .week-rail {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      padding: 6px;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.72);
      scrollbar-width: thin;
    }

    .week-button {
      flex: 1 0 42px;
      min-width: 42px;
      height: 34px;
      padding: 0 8px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      transition: background 140ms ease, color 140ms ease, border-color 140ms ease;
    }

    .week-button:hover {
      background: #edf4f2;
      color: var(--accent-dark);
    }

    .week-button.active {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      box-shadow: 0 5px 14px rgba(12, 107, 103, 0.22);
    }

    .course-filter {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(18, 39, 40, 0.46);
      backdrop-filter: blur(4px);
    }

    .course-filter[hidden] {
      display: none;
    }

    .course-filter-panel {
      display: flex;
      flex-direction: column;
      width: min(780px, 100%);
      max-height: min(82vh, 760px);
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper);
      box-shadow: 0 24px 70px rgba(18, 39, 40, 0.24);
    }

    .filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .filter-heading {
      display: flex;
      align-items: baseline;
      gap: 8px;
      color: #334441;
      font-size: 13px;
      font-weight: 850;
    }

    .filter-count {
      color: var(--soft);
      font-size: 11px;
      font-weight: 700;
    }

    .filter-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .text-button {
      min-height: 30px;
      padding: 0 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
      cursor: pointer;
    }

    .text-button:hover {
      border-color: var(--accent);
      color: var(--accent-dark);
      background: #f6fbfa;
    }

    .text-button:focus-visible,
    .course-option:focus-within {
      outline: 3px solid rgba(12, 107, 103, 0.18);
      outline-offset: 2px;
    }

    .course-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 8px;
      min-height: 0;
      padding-right: 4px;
      overflow-y: auto;
      scrollbar-width: thin;
    }

    .filter-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .confirm-button {
      min-width: 92px;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }

    .confirm-button:hover {
      border-color: var(--accent-dark);
      background: var(--accent-dark);
    }

    .confirm-button:focus-visible,
    .text-button:focus-visible {
      outline: 3px solid rgba(12, 107, 103, 0.18);
      outline-offset: 2px;
    }

    body.modal-open {
      overflow: hidden;
    }

    .course-option {
      --option-accent: #0c6b67;
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
      min-height: 36px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      transition: border-color 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .course-option:has(input:checked) {
      border-color: color-mix(in srgb, var(--option-accent) 42%, white);
      background: color-mix(in srgb, var(--option-accent) 7%, white);
    }

    .course-option:not(:has(input:checked)) {
      opacity: 0.62;
    }

    .course-option input {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      margin: 0;
      accent-color: var(--option-accent);
    }

    .option-dot {
      width: 7px;
      height: 7px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--option-accent);
    }

    .option-name {
      min-width: 0;
      overflow: hidden;
      color: #263633;
      font-size: 12px;
      font-weight: 800;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .option-code {
      margin-left: auto;
      color: var(--soft);
      font-size: 9px;
      font-weight: 800;
      letter-spacing: 0.06em;
    }

    .board-shell {
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .board-viewport {
      max-height: min(72vh, 880px);
      overflow: auto;
      overscroll-behavior: contain;
    }

    .schedule-grid {
      display: grid;
      grid-template-columns: 92px repeat(7, minmax(150px, 1fr));
      min-width: 1180px;
    }

    .grid-head,
    .time-cell,
    .corner {
      background: #f9fbfa;
    }

    .corner,
    .day-head,
    .time-cell,
    .schedule-cell {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .schedule-grid > :nth-child(8n) {
      border-right: 0;
    }

    .corner {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 48px;
      color: var(--soft);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .day-head {
      position: sticky;
      top: 0;
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2px;
      height: 60px;
      padding: 0 14px;
      color: #31433f;
      font-size: 14px;
      font-weight: 800;
    }

    .day-meta {
      display: flex;
      align-items: baseline;
      gap: 7px;
      width: 100%;
    }

    .day-head .day-en {
      color: var(--soft);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .day-date {
      color: var(--soft);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .time-cell {
      position: sticky;
      left: 0;
      z-index: 4;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 5px;
      min-height: 136px;
      padding: 17px 12px;
      border-right: 1px solid var(--line-strong);
    }

    .time-band {
      color: #2b3a3e;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.25;
    }

    .periods {
      color: var(--soft);
      font-size: 12px;
      font-weight: 700;
    }

    .schedule-cell {
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 136px;
      padding: 8px;
      background: #fff;
    }

    .course-card {
      --course-accent: #0c6b67;
      --course-bg: #eaf6f3;
      position: relative;
      padding: 10px 10px 10px 13px;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--course-accent) 18%, white);
      border-radius: 7px;
      background: var(--course-bg);
      box-shadow: 0 1px 2px rgba(24, 51, 49, 0.04);
    }

    .course-card::before {
      position: absolute;
      inset: 0 auto 0 0;
      width: 4px;
      background: var(--course-accent);
      content: "";
    }

    .course-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
    }

    .course-code {
      color: color-mix(in srgb, var(--course-accent) 78%, #31433f);
      font-size: 10px;
      font-weight: 850;
      letter-spacing: 0.08em;
    }

    .course-weeks {
      flex: 0 0 auto;
      color: color-mix(in srgb, var(--course-accent) 70%, #42504e);
      font-size: 10px;
      font-weight: 800;
    }

    .course-name {
      margin: 0;
      color: #1c2a30;
      font-size: 14px;
      font-weight: 850;
      line-height: 1.38;
      overflow-wrap: anywhere;
    }

    .course-meta {
      display: grid;
      gap: 3px;
      margin-top: 7px;
      color: #4f5f5f;
      font-size: 11px;
      line-height: 1.45;
    }

    .course-meta span {
      display: block;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .empty-slot {
      display: grid;
      place-items: center;
      min-height: 116px;
      color: #b5beba;
      font-size: 12px;
      font-weight: 700;
    }

    .board-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 11px 14px;
      background: #f9fbfa;
      color: var(--soft);
      font-size: 11px;
      line-height: 1.5;
    }

    .mobile-week {
      display: none;
    }

    .mobile-day {
      display: grid;
      grid-template-columns: 66px minmax(0, 1fr);
      gap: 8px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }

    .mobile-day:nth-child(even) {
      background: #fbfcfb;
    }

    .mobile-day:last-child {
      border-bottom: 0;
    }

    .mobile-day-head {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      gap: 1px;
      margin: 0;
    }

    .mobile-day-name {
      color: #263633;
      font-size: 12px;
      font-weight: 850;
      line-height: 1.2;
    }

    .mobile-day-date {
      color: var(--soft);
      font-size: 8px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .mobile-day-body {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .mobile-course-wrap {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      align-items: start;
      gap: 5px;
      min-width: 0;
    }

    .mobile-course-time {
      color: var(--accent-dark);
      padding-top: 4px;
      font-size: 9px;
      font-weight: 850;
      line-height: 1.15;
      white-space: nowrap;
    }

    .mobile-empty {
      padding: 4px 0;
      color: #aab4b1;
      font-size: 10px;
      font-weight: 700;
    }

    .mobile-week .course-card {
      min-width: 0;
      padding: 5px 6px 5px 8px;
      border-radius: 5px;
    }

    .mobile-week .course-topline,
    .mobile-week .course-teacher {
      display: none;
    }

    .mobile-week .course-name {
      font-size: 11px;
      line-height: 1.25;
    }

    .mobile-week .course-meta {
      display: block;
      margin-top: 2px;
      color: #4f5f5f;
      font-size: 9px;
      line-height: 1.2;
    }

    .mobile-week .course-room {
      font-weight: 750;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .empty-week {
      display: grid;
      place-items: center;
      min-height: 180px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      font-weight: 700;
    }

    .print-only {
      display: none;
    }

    @media (max-width: 760px) {
      .app {
        width: min(100% - 20px, 1500px);
        padding-top: calc(20px + env(safe-area-inset-top));
      }

      .page-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 12px;
      }

      .eyebrow {
        display: none;
      }

      h1 {
        font-size: 24px;
      }

      .subtitle {
        margin-top: 4px;
        font-size: 12px;
        line-height: 1.4;
      }

      .summary {
        width: 100%;
        min-width: 0;
        padding: 8px 10px;
        font-size: 12px;
      }

      .controls {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      .week-nav {
        justify-content: space-between;
      }

      .week-label {
        flex: 1;
      }

      .actions {
        flex-wrap: wrap;
        gap: 6px;
      }

      .date-control {
        width: 100%;
        height: 34px;
      }

      .choose-button,
      .print-button,
      .install-button {
        flex: 1 1 0;
        width: auto;
        height: 34px;
      }

      .save-mode-icon {
        display: block;
      }

      .print-mode-icon,
      .print-label {
        display: none;
      }

      .save-label {
        display: inline;
      }

      .date-control input {
        flex: 1;
        width: auto;
      }

      .week-rail {
        margin-bottom: 10px;
        padding: 4px;
      }

      .week-button {
        height: 31px;
      }

      .course-filter {
        align-items: stretch;
        padding: 0;
        background: #fff;
        backdrop-filter: none;
      }

      .course-filter-panel {
        width: 100%;
        height: 100%;
        max-height: none;
        padding:
          calc(14px + env(safe-area-inset-top))
          14px
          calc(14px + env(safe-area-inset-bottom));
        border: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .filter-header {
        align-items: center;
        flex-direction: row;
        gap: 6px;
        margin-bottom: 7px;
      }

      .course-options {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
        flex: 1;
        max-height: none;
        padding: 0 2px 8px 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .course-option {
        min-height: 42px;
      }

      .filter-footer {
        margin-top: 10px;
      }

      .text-button,
      .confirm-button {
        min-height: 42px;
      }

      .schedule-grid {
        grid-template-columns: 78px repeat(7, minmax(156px, 1fr));
        min-width: 1170px;
      }

      .board-viewport {
        display: none;
      }

      .mobile-week {
        display: block;
      }

      .time-cell {
        padding-inline: 10px;
      }

      .board-footer {
        display: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    @media print {
      @page {
        size: A4 landscape;
        margin: 8mm;
      }

      body {

      return addDays(semesterStartDate, (selectedWeek - 1) * 7 + dayIndex);
    }

    function updateFilterCount(keys = draftCourseKeys) {
      document.querySelector("#filter-count").textContent =
        `已选 ${keys.size} / ${courseCatalog.length} 门`;
    }

    function persistCourseSelection() {
      storage.write(storageKeys.selectedCourses, JSON.stringify([...selectedCourseKeys]));
    }

    function syncCourseOptionChecks(keys = draftCourseKeys) {
      document.querySelectorAll(".course-option input").forEach((input) => {
        input.checked = keys.has(input.value);
      });
    }

    function renderCourseOptions() {
      const options = document.querySelector("#course-options");
      options.replaceChildren();

      for (const course of courseCatalog) {
        const key = courseKey(course);
        const option = document.createElement("label");
        option.className = "course-option";
        option.style.setProperty("--option-accent", colorFor(key)[0]);

        const input = document.createElement("input");
        input.type = "checkbox";
        input.value = key;
        input.checked = draftCourseKeys.has(key);
        input.addEventListener("change", () => {
          if (input.checked) {
            draftCourseKeys.add(key);
          } else {
            draftCourseKeys.delete(key);
          }
          updateFilterCount();
        });

        const dot = document.createElement("span");
        dot.className = "option-dot";

        const name = document.createElement("span");
        name.className = "option-name";
        name.textContent = course.name;
        name.title = course.name;

        const code = document.createElement("span");
        code.className = "option-code";
        code.textContent = course.code;

        option.append(input, dot, name, code);
        options.append(option);
      }

      updateFilterCount();
    }

    let courseSelectionReturnFocus = null;

    function openCourseSelection() {
      courseSelectionReturnFocus = document.activeElement;
      draftCourseKeys = new Set(selectedCourseKeys);
      syncCourseOptionChecks();
      updateFilterCount();
      document.querySelector("#course-filter").hidden = false;
      document.body.classList.add("modal-open");
      document.querySelector("#confirm-course-selection").focus();
    }

    function closeCourseSelection(restoreFocus = true) {
      document.querySelector("#course-filter").hidden = true;
      document.body.classList.remove("modal-open");
      if (restoreFocus && courseSelectionReturnFocus instanceof HTMLElement) {
        courseSelectionReturnFocus.focus();
      }
    }

    function createCourseCard(course) {
      const card = document.createElement("article");
      const [accent, background] = colorFor(course.code + course.name);
      card.className = "course-card";
      card.style.setProperty("--course-accent", accent);
      card.style.setProperty("--course-bg", background);
      card.title = [
        course.name,
        `周次：${course.weeks}`,
        `节次：${course.periods}`,
        `教师：${course.teachers.join("、")}`,
        `教室：${course.room}`
      ].join("\n");

      const topline = document.createElement("div");
      topline.className = "course-topline";

      const code = document.createElement("span");
      code.className = "course-code";
      code.textContent = course.code;

      const weeks = document.createElement("span");
      weeks.className = "course-weeks";
      weeks.textContent = course.weeks;

      topline.append(code, weeks);

      const name = document.createElement("h3");
      name.className = "course-name";
      name.textContent = course.name;

      const meta = document.createElement("div");
      meta.className = "course-meta";

      const teacher = document.createElement("span");
      teacher.className = "course-teacher";
      teacher.textContent = course.teachers.join("、");

      const room = document.createElement("span");
      room.className = "course-room";
      room.textContent = course.room;

      meta.append(teacher, room);
      card.append(topline, name, meta);
      return card;
    }

    function renderMobileWeek(weekCourses) {
      const container = document.querySelector("#mobile-week");
      container.replaceChildren();

      days.forEach((day, dayIndex) => {
        const section = document.createElement("section");
        section.className = "mobile-day";

        const header = document.createElement("div");
        header.className = "mobile-day-head";

        const name = document.createElement("span");
        name.className = "mobile-day-name";
        name.textContent = day.label;

        const date = dateForDay(dayIndex);
        const dateLabel = document.createElement("span");
        dateLabel.className = "mobile-day-date";
        dateLabel.textContent = date ? formatDate(date) : "未设置日期";

        header.append(name, dateLabel);

        const body = document.createElement("div");
        body.className = "mobile-day-body";
        const dayCourses = weekCourses
          .filter((course) => course.day === day.label)
          .sort(
            (left, right) =>
              timeRows.findIndex((row) => row.periods === left.periods) -
              timeRows.findIndex((row) => row.periods === right.periods)
          );

        if (dayCourses.length === 0) {
          const empty = document.createElement("div");
          empty.className = "mobile-empty";
          empty.textContent = "无课";
          body.append(empty);
        } else {
          for (const course of dayCourses) {
            const wrapper = document.createElement("div");
            wrapper.className = "mobile-course-wrap";

            const time = document.createElement("div");
            time.className = "mobile-course-time";
            time.textContent = `第 ${course.periods} 节`;

            wrapper.append(time, createCourseCard(course));
            body.append(wrapper);
          }
        }

        section.append(header, body);
        container.append(section);
      });
    }

    function renderWeekRail() {
      const rail = document.querySelector("#week-rail");
      rail.replaceChildren();

      for (let week = 1; week <= 18; week += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "week-button";
        button.textContent = `第 ${week} 周`;
        button.classList.toggle("active", week === selectedWeek);
        button.setAttribute("aria-pressed", String(week === selectedWeek));
        button.addEventListener("click", () => {
          selectedWeek = week;
          render();
        });
        rail.append(button);
      }
    }

    function renderGrid(weekCourses) {
      const grid = document.querySelector("#schedule-grid");
      grid.replaceChildren();

      const corner = document.createElement("div");
      corner.className = "corner";
      corner.textContent = "节次";
      grid.append(corner);

      days.forEach((day, dayIndex) => {
        const head = document.createElement("div");
        head.className = "day-head";

        const label = document.createElement("span");
        label.textContent = day.label;

        const short = document.createElement("span");
        short.className = "day-en";
        short.textContent = day.short;

        const meta = document.createElement("div");
        meta.className = "day-meta";
        meta.append(label, short);

        const dayDate = document.createElement("span");
        dayDate.className = "day-date";
        const date = dateForDay(dayIndex);
        dayDate.textContent = date ? formatDate(date) : "未设置日期";

        head.append(meta, dayDate);
        grid.append(head);
      });

      for (const row of timeRows) {
        const timeCell = document.createElement("div");
        timeCell.className = "time-cell";

        const band = document.createElement("div");
        band.className = "time-band";
        band.textContent = row.label;

        const periods = document.createElement("div");
        periods.className = "periods";
        periods.textContent = `第 ${row.periods} 节`;

        timeCell.append(band, periods);
        grid.append(timeCell);

        for (const day of days) {
          const cell = document.createElement("section");
          cell.className = "schedule-cell";
          cell.setAttribute("aria-label", `${day.label}，${row.label}`);

          const cellCourses = weekCourses.filter(
            (course) => course.day === day.label && course.periods === row.periods
          );

          if (cellCourses.length === 0) {
            const empty = document.createElement("div");
            empty.className = "empty-slot";
            empty.textContent = "无课";
            cell.append(empty);
          } else {
            cellCourses.forEach((course) => cell.append(createCourseCard(course)));
          }

          grid.append(cell);
        }
      }
    }

    function updateSummary(weekCourses) {
      if (selectedCourseKeys.size === 0) {
        document.querySelector("#summary").textContent = "未选择课程";
        return;
      }

      const uniqueCourses = new Set(weekCourses.map((course) => course.code + course.name));
      document.querySelector("#summary").textContent =
        `第 ${selectedWeek} 周 · ${uniqueCourses.size} 门课程 · ${weekCourses.length} 个上课安排`;
    }

    function updateWeekLabel() {
      const weekLabel = document.querySelector("#week-label");
      if (!semesterStartDate) {
        weekLabel.textContent = `第 ${selectedWeek} 周`;
        return;
      }

      const start = dateForDay(0);
      const end = dateForDay(6);
      weekLabel.textContent =
        `第 ${selectedWeek} 周 · ${formatDate(start)} 至 ${formatDate(end)}`;
    }

    function selectedWeekCourses() {
      return courses
        .filter(
          (course) =>
            selectedCourseKeys.has(courseKey(course)) &&
            course.weekNumbers.includes(selectedWeek)
        )
        .sort((left, right) => {
          const dayDifference =
            days.findIndex((day) => day.label === left.day) -
            days.findIndex((day) => day.label === right.day);
          if (dayDifference !== 0) {
            return dayDifference;
          }
          return (
            timeRows.findIndex((row) => row.periods === left.periods) -
            timeRows.findIndex((row) => row.periods === right.periods)
          );
        });
    }

    function fillRoundedRect(context, x, y, width, height, radius, fillStyle) {
      const corner = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + corner, y);
      context.lineTo(x + width - corner, y);
      context.arcTo(x + width, y, x + width, y + corner, corner);
      context.lineTo(x + width, y + height - corner);
      context.arcTo(x + width, y + height, x + width - corner, y + height, corner);
      context.lineTo(x + corner, y + height);
      context.arcTo(x, y + height, x, y + height - corner, corner);
      context.lineTo(x, y + corner);
      context.arcTo(x, y, x + corner, y, corner);
      context.closePath();
      context.fillStyle = fillStyle;
      context.fill();
    }

    function fitCanvasText(context, text, maxWidth) {
      if (context.measureText(text).width <= maxWidth) {
        return text;
      }

      let output = text;
      while (output.length > 1 && context.measureText(`${output}…`).width > maxWidth) {
        output = output.slice(0, -1);
      }
      return `${output}…`;
    }

    function buildWeekImageBlob(weekCourses) {
      const width = 1080;
      const margin = 48;
      const headerHeight = 174;
      const dayHeaderHeight = 48;
      const courseHeight = 88;
      const courseGap = 10;
      const emptyHeight = 58;
      const dayGap = 20;
      const layouts = days.map((day, dayIndex) => {
        const items = weekCourses.filter((course) => course.day === day.label);
        const bodyHeight = items.length
          ? items.length * courseHeight + (items.length - 1) * courseGap
          : emptyHeight;
        return {
          day,
          dayIndex,
          items,
          height: dayHeaderHeight + bodyHeight
        };
      });
      const contentHeight = layouts.reduce((total, layout) => total + layout.height + dayGap, 0);
      const height = Math.max(1280, headerHeight + contentHeight + margin + 30);
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const context = canvas.getContext("2d");

      context.fillStyle = "#f3f6f3";
      context.fillRect(0, 0, width, height);
      context.fillStyle = "#0c6b67";
      context.fillRect(0, 0, width, headerHeight);

      context.fillStyle = "#ffffff";
      context.font =
        '850 42px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
      context.fillText(`第 ${selectedWeek} 周课表`, margin, 72);

      context.font =
        '500 23px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
      context.fillStyle = "rgba(255, 255, 255, 0.78)";
      const dateText = semesterStartDate
        ? `${formatDate(dateForDay(0))} 至 ${formatDate(dateForDay(6))}`
        : "未设置第 1 周日期";
      context.fillText(dateText, margin, 116);

      let y = headerHeight + 26;
      for (const layout of layouts) {
        const date = dateForDay(layout.dayIndex);
        context.fillStyle = "#263633";
        context.font =
          '850 28px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
        context.fillText(layout.day.label, margin, y + 30);

        context.fillStyle = "#7a8987";
        context.font =
          '600 20px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
        context.fillText(date ? formatDate(date) : "未设置日期", margin + 150, y + 30);

        context.strokeStyle = "#d9e0dd";
        context.lineWidth = 2;
        context.beginPath();
        context.moveTo(margin, y + dayHeaderHeight - 8);
        context.lineTo(width - margin, y + dayHeaderHeight - 8);
        context.stroke();
        y += dayHeaderHeight;

        if (layout.items.length === 0) {
          fillRoundedRect(context, margin, y, width - margin * 2, emptyHeight, 14, "#ffffff");
          context.fillStyle = "#aab4b1";
          context.font =
            '700 20px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
          context.fillText("无课", margin + 24, y + 36);
          y += emptyHeight + dayGap;
          continue;
        }

        for (const course of layout.items) {
          const [accent, background] = colorFor(course.code + course.name);
          const cardX = margin;
          const cardWidth = width - margin * 2;
          fillRoundedRect(context, cardX, y, cardWidth, courseHeight, 16, background);
          fillRoundedRect(context, cardX, y, 8, courseHeight, 4, accent);

          context.fillStyle = accent;
          context.font =
            '850 18px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
          context.fillText(`第 ${course.periods} 节`, cardX + 26, y + 32);

          context.fillStyle = "#1c2a30";
          context.font =
            '850 27px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
          context.fillText(
            fitCanvasText(context, course.name, 650),
            cardX + 154,
            y + 38
          );

          context.fillStyle = "#52625f";
          context.font =
            '700 19px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
          context.fillText(`教室：${course.room}`, cardX + 154, y + 68);
          y += courseHeight + courseGap;
        }

        y += dayGap - courseGap;
      }

      context.fillStyle = "#8b989d";
      context.font =
        '500 17px "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", sans-serif';
      context.fillText("2026 秋研究生课表", margin, height - 34);

      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) {
            resolve(blob);
          } else {
            reject(new Error("Unable to generate schedule image"));
          }
        }, "image/png");
      });
    }

    async function saveWeekImage() {
      const button = document.querySelector("#print-page");
      const weekCourses = selectedWeekCourses();
      button.disabled = true;
      button.setAttribute("aria-busy", "true");

      try {
        const blob = await buildWeekImageBlob(weekCourses);
        const file = new File([blob], `课表-第${selectedWeek}周.png`, {
          type: "image/png"
        });

        if (navigator.share && navigator.canShare?.({ files: [file] })) {
          try {
            await navigator.share({
              files: [file],
              title: `第 ${selectedWeek} 周课表`
            });
            return;
          } catch (error) {
            if (error?.name === "AbortError") {
              return;
            }
          }
        }

        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = file.name;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } finally {
        button.disabled = false;
        button.removeAttribute("aria-busy");
      }
    }

    function render() {
      const weekCourses = selectedWeekCourses();
      updateWeekLabel();
      document.querySelector("#previous-week").disabled = selectedWeek === 1;
      document.querySelector("#next-week").disabled = selectedWeek === 18;
      renderWeekRail();
      renderGrid(weekCourses);
      renderMobileWeek(weekCourses);
      updateSummary(weekCourses);
    }

    document.querySelector("#previous-week").addEventListener("click", () => {
      if (selectedWeek > 1) {
        selectedWeek -= 1;
        render();
      }
    });

    document.querySelector("#next-week").addEventListener("click", () => {
      if (selectedWeek < 18) {
        selectedWeek += 1;
        render();
      }
    });

    const semesterStartInput = document.querySelector("#semester-start");
    if (semesterStartDate) {
      semesterStartInput.value = formatDate(semesterStartDate);
    }

    semesterStartInput.addEventListener("change", () => {
      const selectedDate = parseDateValue(semesterStartInput.value);
      if (!selectedDate) {
        semesterStartDate = null;
        semesterStartInput.value = "";
        storage.remove(storageKeys.semesterStart);
        render();
        return;
      }

      semesterStartDate = mondayOf(selectedDate);
      semesterStartInput.value = formatDate(semesterStartDate);
      storage.write(storageKeys.semesterStart, formatDate(semesterStartDate));
      render();
    });

    document.querySelector("#select-all-courses").addEventListener("click", () => {
      draftCourseKeys = new Set(availableCourseKeys);
      syncCourseOptionChecks();
      updateFilterCount();
    });

    document.querySelector("#clear-all-courses").addEventListener("click", () => {
      draftCourseKeys = new Set();
      syncCourseOptionChecks();
      updateFilterCount();
    });

    document.querySelector("#choose-courses").addEventListener("click", openCourseSelection);

    document.querySelector("#cancel-course-selection").addEventListener("click", () => {
      closeCourseSelection();
    });

    document.querySelector("#confirm-course-selection").addEventListener("click", () => {
      selectedCourseKeys = new Set(draftCourseKeys);
      persistCourseSelection();
      closeCourseSelection();
      render();
    });

    const courseFilter = document.querySelector("#course-filter");
    courseFilter.addEventListener("click", (event) => {
      if (event.target === courseFilter) {
        closeCourseSelection();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !courseFilter.hidden) {
        closeCourseSelection();
      }
    });

    const mobileMedia = window.matchMedia("(max-width: 760px)");

    document.querySelector("#print-page").addEventListener("click", () => {
      if (mobileMedia.matches) {
        saveWeekImage();
      } else {
        window.print();
      }
    });

    const installButton = document.querySelector("#install-app");
    let deferredInstallPrompt = null;
    const isStandalone =
      window.matchMedia("(display-mode: standalone)").matches ||
      window.navigator.standalone === true;

    if (isStandalone) {
      installButton.hidden = true;
    }

    window.addEventListener("beforeinstallprompt", (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      installButton.hidden = false;
    });

    installButton.addEventListener("click", async () => {
      if (!deferredInstallPrompt) {
        return;
      }

      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installButton.hidden = true;
    });

    window.addEventListener("appinstalled", () => {
      deferredInstallPrompt = null;
      installButton.hidden = true;
    });

    if ("serviceWorker" in navigator && window.location.protocol.startsWith("http")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.mjs").catch(() => {
          // The page remains usable when the app is opened from a local file.
        });
      });
    }

    renderCourseOptions();
    render();
  </script>
</body>
